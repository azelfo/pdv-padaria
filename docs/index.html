<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Painel da Rede — Padaria Venâncio</title>
<link rel="manifest" href="manifest.json" />
<!-- PWA: Android/Chrome -->
<meta name="theme-color" content="#F59E0B" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- PWA: Apple/iOS -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Padaria Venâncio" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --card2:#21262f; --line:#2b313c;
  --text:#e5e7eb; --muted:#9aa3b2; --accent:#F59E0B; --accent-fg:#1a1205;
  --green:#22c55e; --red:#ef4444; --red-soft:#fca5a5;
  --tab-h:56px;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* -------- LOGIN -------- */
#loginWrap{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--st) + 24px) 16px calc(var(--sb) + 24px);
}
#loginWrap .brand-logo{display:block;height:110px;width:auto;border-radius:10px;margin:0 auto 28px}
#loginCard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}

/* -------- APP HEADER -------- */
.app-header{
  position:sticky;top:0;z-index:10;
  background:var(--bg);border-bottom:1px solid var(--line);
  padding:8px 16px;padding-top:calc(8px + var(--st));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand-logo{height:52px;width:auto;border-radius:8px}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:1px}

/* -------- WRAP -------- */
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(var(--tab-h) + var(--sb) + 20px)}

/* -------- CARDS & FORMS -------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 6px}
input,select{
  width:100%;padding:14px;
  background:var(--card2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-size:16px;
  appearance:none;-webkit-appearance:none;
  min-height:48px;
}
input:focus,select:focus{outline:none;border-color:var(--accent)}

/* -------- BUTTONS -------- */
button{cursor:pointer;border:none;border-radius:10px;font-weight:600;font-size:15px;-webkit-tap-highlight-color:transparent}
.btn-primary{
  width:100%;padding:15px;background:var(--accent);color:var(--accent-fg);
  margin-top:20px;font-size:16px;border-radius:12px;min-height:52px;
}
.btn-primary:disabled{opacity:.6;cursor:default}
.btn-sm{
  padding:10px 16px;background:var(--card2);border:1px solid var(--line);
  color:var(--text);font-size:16px;border-radius:10px;min-height:48px;min-width:48px;
}
.btn-save{
  padding:10px 14px;background:var(--accent);color:var(--accent-fg);
  font-size:14px;border-radius:10px;min-width:72px;min-height:44px;
}
.btn-save:disabled{opacity:.5;cursor:default}
.link{
  color:var(--muted);font-size:13px;background:none;
  padding:6px 2px;min-height:36px;display:inline-flex;align-items:center;
}

/* -------- PERIODS -------- */
.periods{display:flex;gap:8px;margin-bottom:14px}
.periods button{
  flex:1;padding:12px 6px;
  background:var(--card);border:1px solid var(--line);
  color:var(--muted);font-size:14px;border-radius:10px;min-height:46px;
}
.periods button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* -------- KPIs -------- */
.totais{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:400px){.totais{grid-template-columns:1fr 1fr 1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.kpi .v{font-size:20px;font-weight:700;color:var(--accent)}
.kpi .l{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

/* -------- LOJAS -------- */
.loja{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.loja:last-child{border-bottom:none}
.loja .nome{font-weight:600;font-size:15px}
.loja .meta{font-size:12px;color:var(--muted);margin-top:3px}
.loja .fat{font-size:17px;font-weight:700;white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;margin-left:6px}
.badge.alerta{background:rgba(239,68,68,.15);color:var(--red-soft)}

/* -------- SEC / TOP -------- */
.sec-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.top:last-child{border-bottom:none}
.top .q{color:var(--muted);font-size:12px}

/* -------- ALERTS -------- */
.err{background:rgba(239,68,68,.12);color:var(--red-soft);border:1px solid rgba(239,68,68,.3);padding:12px 14px;border-radius:10px;font-size:14px;margin-top:12px}
.ok{background:rgba(34,197,94,.1);color:#86efac;border:1px solid rgba(34,197,94,.3);padding:12px 14px;border-radius:10px;font-size:14px;margin-top:12px}
.hidden{display:none !important}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:12px;text-align:center;margin-top:4px}

/* -------- BOTTOM TAB BAR -------- */
.bottom-tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;
  padding-bottom:var(--sb);
}
.tab-btn{
  flex:1;padding:8px;background:none;color:var(--muted);
  font-size:11px;font-weight:600;border-radius:0;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  height:var(--tab-h);
}
.tab-icon{font-size:22px;line-height:1}
.tab-btn.on{color:var(--accent)}
.tab-pane{display:none}
.tab-pane.on{display:block}

/* -------- ESTOQUE -------- */
.estq-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.estq-header select{flex:1;min-width:0}
.estq-filters{display:flex;gap:8px;margin-bottom:14px}
.estq-filters button{
  flex:1;padding:11px 6px;
  background:var(--card);border:1px solid var(--line);
  color:var(--muted);font-size:13px;border-radius:10px;min-height:44px;
}
.estq-filters button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.prod-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.3px}
.prod-badge.prod{background:rgba(245,158,11,.15);color:var(--accent)}
.prod-row{
  display:grid;grid-template-columns:1fr auto auto auto;
  align-items:center;gap:8px;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.prod-row:last-child{border-bottom:none}
@media(max-width:400px){
  .prod-row{grid-template-columns:1fr auto auto}
  .prod-info{grid-column:1/4}
}
.btn-del{
  padding:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);
  color:var(--red-soft);font-size:16px;border-radius:10px;min-width:44px;min-height:44px;
}
.btn-del:disabled{opacity:.5;cursor:default}
.prod-nome{font-size:15px;font-weight:600}
.prod-meta{font-size:12px;color:var(--muted);margin-top:2px}
.qty-input{
  width:80px;padding:10px 6px;text-align:center;
  font-size:16px;font-weight:700;color:var(--accent);min-height:44px;
}

/* -------- PERÍODO PERSONALIZADO -------- */
.custom-range{
  background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:14px;
}
.custom-range label{margin-top:0}

/* -------- VENDAS -------- */
.venda-resumo{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.venda-resumo .vr-fat{font-size:20px;font-weight:700;color:var(--accent)}
.venda-resumo .vr-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.venda-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer;
}
.venda-row:last-child{border-bottom:none}
.venda-row:active{background:var(--card2)}
.venda-hora{font-weight:600;font-size:15px}
.venda-meta{font-size:12px;color:var(--muted);margin-top:3px}
.venda-tot{font-size:16px;font-weight:700;white-space:nowrap;text-align:right}
.venda-chevron{color:var(--muted);font-size:18px;margin-left:4px}
.badge-status{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;margin-left:6px;text-transform:uppercase;letter-spacing:.3px}
.badge-status.aprovado{background:rgba(34,197,94,.15);color:#86efac}
.badge-status.cancelado{background:rgba(239,68,68,.15);color:var(--red-soft)}
.badge-status.pendente{background:rgba(245,158,11,.15);color:var(--accent)}

/* -------- MODAL -------- */
.modal-overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;
  padding:0;
}
@media(min-width:600px){.modal-overlay{align-items:center;padding:16px}}
.modal-card{
  background:var(--card);width:100%;max-width:520px;
  border:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:18px;padding-bottom:calc(18px + var(--sb));
  max-height:88vh;overflow-y:auto;
}
@media(min-width:600px){.modal-card{border-radius:16px;padding-bottom:18px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:var(--card2);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:10px;font-size:16px}
.md-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px}
.md-row .k{color:var(--muted)}
.md-sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
.md-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.md-item:last-child{border-bottom:none}
.md-item .qi{color:var(--muted);font-size:12px;margin-top:2px}
.md-total{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:18px;font-weight:700}
.md-total .accent{color:var(--accent)}

/* -------- SPINNER -------- */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginWrap">
  <img src="logo.png" alt="Padaria Venâncio" class="brand-logo" />
  <div id="loginCard">
    <label>E-mail do dono</label>
    <input id="email" type="email" placeholder="dono@padaria.com" autocomplete="username" value="dono@padaria.com" />
    <label>Senha</label>
    <input id="senha" type="password" placeholder="sua senha" autocomplete="current-password" />
    <button id="entrarBtn" class="btn-primary">Entrar</button>
    <div id="loginErr" class="err hidden"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="dash" class="hidden">

  <header class="app-header">
    <img src="logo.png" alt="Padaria Venâncio" class="brand-logo" />
    <div class="header-right">
      <span id="oi" class="muted" style="font-size:12px"></span>
      <button class="link" id="sairBtn">Sair</button>
    </div>
  </header>

  <div class="wrap">

    <!-- ABA: DASHBOARD -->
    <div id="tab-dashboard" class="tab-pane on">
      <div class="periods" id="dashPeriods">
        <button data-d="0" class="on">Hoje</button>
        <button data-d="7">7 dias</button>
        <button data-d="30">30 dias</button>
        <button data-d="custom">📅</button>
      </div>
      <div id="dashCustom" class="custom-range hidden">
        <label>De</label>
        <input id="dashDe" type="datetime-local" />
        <label>Até</label>
        <input id="dashAte" type="datetime-local" />
        <button class="btn-primary" id="dashAplicar" style="margin-top:12px">Aplicar período</button>
      </div>

      <div class="totais">
        <div class="kpi"><div class="v" id="tFat">—</div><div class="l">Faturamento</div></div>
        <div class="kpi"><div class="v" id="tVendas">—</div><div class="l">Vendas</div></div>
        <div class="kpi"><div class="v" id="tLojas">—</div><div class="l">Lojas</div></div>
      </div>

      <div class="card">
        <div class="sec-title">Por loja</div>
        <div id="lojas"></div>
      </div>

      <div class="card">
        <div class="sec-title">Produtos mais vendidos</div>
        <div id="top"></div>
      </div>

      <div id="dashErr" class="err hidden"></div>
      <div class="sub" id="atualizado"></div>
    </div>

    <!-- ABA: ESTOQUE -->
    <div id="tab-estoque" class="tab-pane">
      <div class="estq-header">
        <select id="estqLoja"></select>
        <button class="btn-sm" id="estqReload">↻</button>
      </div>

      <input id="estqBusca" type="search" placeholder="Buscar produto..." style="margin-bottom:12px" />

      <button class="btn-primary" id="novoProdBtn" style="margin-top:0;margin-bottom:12px">+ Novo produto</button>

      <div class="estq-filters">
        <button data-f="TODOS" class="on">Todos</button>
        <button data-f="COMERCIAIS">Comerciais</button>
        <button data-f="PRODUCAO">Produção</button>
      </div>

      <div class="card" id="estqCard">
        <div class="muted" style="padding:8px 0">Selecione uma loja acima.</div>
      </div>

      <div id="estqErr" class="err hidden"></div>
      <div id="estqOk" class="ok hidden"></div>
    </div>

    <!-- ABA: VENDAS -->
    <div id="tab-vendas" class="tab-pane">
      <div class="estq-header">
        <select id="vendaLoja"></select>
        <button class="btn-sm" id="vendaReload">↻</button>
      </div>

      <div class="periods" id="vendaPeriods">
        <button data-d="0" class="on">Hoje</button>
        <button data-d="7">7 dias</button>
        <button data-d="30">30 dias</button>
        <button data-d="custom">📅</button>
      </div>
      <div id="vendaCustom" class="custom-range hidden">
        <label>De</label>
        <input id="vendaDe" type="datetime-local" />
        <label>Até</label>
        <input id="vendaAte" type="datetime-local" />
        <button class="btn-primary" id="vendaAplicar" style="margin-top:12px">Aplicar período</button>
      </div>

      <div class="venda-resumo" id="vendaResumo"></div>

      <div class="card" id="vendaLista">
        <div class="muted" style="padding:8px 0">Carregando...</div>
      </div>

      <div id="vendaErr" class="err hidden"></div>
    </div>

  </div>

  <nav class="bottom-tabs">
    <button class="tab-btn on" data-tab="dashboard">
      <span class="tab-icon">📊</span>Dashboard
    </button>
    <button class="tab-btn" data-tab="vendas">
      <span class="tab-icon">🧾</span>Vendas
    </button>
    <button class="tab-btn" data-tab="estoque">
      <span class="tab-icon">📦</span>Estoque
    </button>
  </nav>

</div>

<!-- ===== MODAL: DETALHE DA VENDA ===== -->
<div id="vendaModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">Detalhe da venda</div>
      <button class="modal-close" id="vendaModalClose">✕</button>
    </div>
    <div id="vendaModalBody"></div>
  </div>
</div>

<!-- ===== MODAL: NOVO PRODUTO ===== -->
<div id="prodModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">Novo produto</div>
      <button class="modal-close" id="prodModalClose">✕</button>
    </div>
    <div class="muted" style="font-size:12px;margin-bottom:10px">O produto fica disponível em todas as lojas. Depois é só lançar a quantidade de cada uma.</div>

    <label>Nome do produto</label>
    <input id="prodNome" type="text" placeholder="ex: Refrigerante 2L" />

    <label>Categoria</label>
    <select id="prodCategoria"></select>

    <label>Unidade de medida</label>
    <select id="prodUnidade">
      <option value="UN">Unidade (UN)</option>
      <option value="KG">Quilo (KG)</option>
    </select>

    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Preço de venda (R$)</label><input id="prodPrecoVenda" type="number" min="0" step="0.01" placeholder="0,00" /></div>
      <div style="flex:1"><label>Preço de custo (R$)</label><input id="prodPrecoCusto" type="number" min="0" step="0.01" placeholder="0,00" /></div>
    </div>

    <label>Código de barras <span class="muted" style="font-weight:400">(sem código? clique em Gerar)</span></label>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="prodBarras" type="text" inputmode="numeric" placeholder="escaneie ou digite" style="flex:1" />
      <button class="btn-sm" id="prodGerarCodigo" title="Gera um código interno para produto sem código de barras (coxinha, salgado, bolo)">Gerar</button>
    </div>

    <button class="btn-primary" id="prodSalvar">Cadastrar produto</button>
    <div id="prodErr" class="err hidden"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://aezwtbzyremthqdkldzl.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlend0Ynp5cmVtdGhxZGtsZHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NDI4NjEsImV4cCI6MjA5NzAxODg2MX0.kShlLQFGG8PeMpBPbB0Lfbu4bbB-pMdqNO-yOWej1us";

let creds = { email:"", senha:"" };
let lojasList = [];
// Estado de período por aba: dias = 0|7|30|'custom'; de/ate só usados no custom (datetime-local).
let dashPeriodo  = { dias:0, de:null, ate:null };
let vendaPeriodo = { dias:0, de:null, ate:null };

const $ = id => document.getElementById(id);
const brl = c => (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const rpc = (fn, body) => fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn, {
  method:"POST",
  headers:{ "apikey":ANON_KEY, "Authorization":"Bearer "+ANON_KEY, "Content-Type":"application/json" },
  body: JSON.stringify(body)
}).then(r => r.json());

function pad(n){return String(n).padStart(2,'0')}
function fmtLocal(d){
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
// Calcula {de, ate} (strings 'YYYY-MM-DDTHH:MM:SS') a partir do estado de período.
function calcPeriodo(st){
  if(st.dias==='custom'){
    if(!st.de || !st.ate) return null;
    // datetime-local vem como 'YYYY-MM-DDTHH:MM'; completa segundos.
    return { de: st.de+':00', ate: st.ate+':59' };
  }
  const ate = new Date(), de = new Date();
  const d = parseInt(st.dias,10)||0;
  if(d===0){ de.setHours(0,0,0,0); }
  else { de.setDate(de.getDate()-d); de.setHours(0,0,0,0); }
  const fim = new Date(ate); fim.setHours(23,59,59,999);
  return { de: fmtLocal(de), ate: fmtLocal(fim) };
}

// ---- Dashboard ----
async function buscar(){
  const p = calcPeriodo(dashPeriodo);
  if(!p) throw new Error("Selecione as datas De e Até.");
  const data = await rpc('get_dashboard_rede', { p_email:creds.email, p_password:creds.senha, p_from:p.de, p_to:p.ate });
  if(data.error){ throw new Error(data.error==='invalid_credentials'?"E-mail ou senha inválidos":data.error==='forbidden'?"Sem acesso ao painel":data.error); }
  return data;
}

function renderDash(d){
  $('tFat').textContent = brl(d.rede.faturamento_centavos);
  $('tVendas').textContent = d.rede.vendas_qtd;
  $('tLojas').textContent = d.rede.lojas_total;

  lojasList = (d.lojas||[]).map(l => ({ storeId: l.storeId||l.store_id||'', nome: l.nome }));
  preencherSeletorLojas();

  $('lojas').innerHTML = (d.lojas||[]).map(l=>`
    <div class="loja">
      <div>
        <div class="nome">${l.nome}${l.estoque_baixo>0?`<span class="badge alerta">${l.estoque_baixo} em falta</span>`:''}</div>
        <div class="meta">${l.vendas_qtd} venda(s) · ${l.estoque_produtos} produtos</div>
      </div>
      <div class="fat">${brl(l.faturamento_centavos)}</div>
    </div>`).join('');

  $('top').innerHTML = (d.top_produtos||[]).length
    ? d.top_produtos.map(t=>`<div class="top"><div>${t.nome} <span class="q">×${t.qtd}</span></div><div>${brl(t.faturamento_centavos)}</div></div>`).join('')
    : '<div class="muted" style="padding:8px 0">Nenhuma venda no período.</div>';

  $('atualizado').textContent = "Atualizado às "+new Date().toLocaleTimeString('pt-BR');
}

async function carregar(){
  $('dashErr').classList.add('hidden');
  try{ renderDash(await buscar()); }
  catch(e){ $('dashErr').textContent=e.message; $('dashErr').classList.remove('hidden'); }
}

// ---- Estoque ----
function preencherSeletorLojas(){
  const sel = $('estqLoja');
  const atual = sel.value;
  sel.innerHTML = '<option value="">— selecione a loja —</option>' +
    lojasList.map(l=>`<option value="${l.storeId}">${l.nome}</option>`).join('');
  if(atual) sel.value = atual;
}

let estqFiltro = 'TODOS';

async function carregarEstoque(){
  const storeId = $('estqLoja').value;
  $('estqErr').classList.add('hidden');
  $('estqOk').classList.add('hidden');
  if(!storeId){ $('estqCard').innerHTML='<div class="muted" style="padding:8px 0">Selecione uma loja acima.</div>'; window._estqProds=null; return; }

  $('estqCard').innerHTML = '<span class="spinner"></span><span class="muted">Carregando...</span>';

  const data = await rpc('get_loja_estoque', { p_email:creds.email, p_password:creds.senha, p_store_id:storeId });

  if(data.error){
    $('estqCard').innerHTML='';
    $('estqErr').textContent = data.error==='invalid_credentials'?"Sessão expirada, faça login novamente.":data.error;
    $('estqErr').classList.remove('hidden');
    return;
  }

  window._estqProds = data.produtos||[];
  window._estqCategorias = data.categorias||[];
  $('estqCard').dataset.storeId = storeId;
  renderEstoque();
}

// É de produção tudo que NÃO é mercadoria normal (mesma regra do PDV: Type != "NORMAL").
function ehProducao(tipo){ return (tipo||'NORMAL').toUpperCase() !== 'NORMAL'; }

function renderEstoque(){
  const prods = window._estqProds;
  if(!prods){ return; }
  if(!prods.length){
    $('estqCard').innerHTML='<div class="muted" style="padding:8px 0">Nenhum produto cadastrado nesta loja.</div>';
    return;
  }

  const busca = ($('estqBusca').value||'').trim().toLowerCase();

  // Mantém o índice ORIGINAL (para salvarItem casar com window._estqProds)
  const visiveis = prods
    .map((p,i)=>({p,i}))
    .filter(({p})=>{
      if(estqFiltro==='COMERCIAIS' && ehProducao(p.tipo)) return false;
      if(estqFiltro==='PRODUCAO'   && !ehProducao(p.tipo)) return false;
      if(busca && !(p.nome||'').toLowerCase().includes(busca)) return false;
      return true;
    });

  if(!visiveis.length){
    $('estqCard').innerHTML='<div class="muted" style="padding:8px 0">Nenhum produto neste filtro.</div>';
    return;
  }

  $('estqCard').innerHTML = visiveis.map(({p,i})=>`
    <div class="prod-row" data-i="${i}" data-pid="${p.productId}" data-orig="${p.quantidade}">
      <div class="prod-info">
        <div class="prod-nome">${p.nome}${ehProducao(p.tipo)?'<span class="prod-badge prod">Produção</span>':''}</div>
        <div class="prod-meta">${p.unitMeasure} · mín ${p.minimo}</div>
      </div>
      <input type="number" class="qty-input" value="${p.quantidade}" min="0" step="${p.unitMeasure==='KG'?'0.001':'1'}" data-i="${i}" />
      <button class="btn-save" data-i="${i}" onclick="salvarItem(this)">Salvar</button>
      <button class="btn-del" data-i="${i}" onclick="excluirItem(this)" title="Excluir produto">🗑</button>
    </div>`).join('');
}

async function salvarItem(btn){
  const i = parseInt(btn.dataset.i);
  const prod = window._estqProds[i];
  const storeId = $('estqCard').dataset.storeId;
  const row = document.querySelector(`.prod-row[data-i="${i}"]`);
  const input = row.querySelector('input');
  const novaQtd = parseFloat(input.value);

  if(isNaN(novaQtd) || novaQtd < 0){ input.focus(); return; }

  btn.disabled = true;
  btn.textContent = '...';
  $('estqErr').classList.add('hidden');
  $('estqOk').classList.add('hidden');

  const res = await rpc('ajustar_estoque', {
    p_email: creds.email,
    p_password: creds.senha,
    p_store_id: storeId,
    p_product_id: prod.productId,
    p_nova_quantidade: novaQtd,
    p_motivo: 'AJUSTE_MANUAL'
  });

  if(res.error){
    $('estqErr').textContent = res.error==='invalid_credentials'?"Sessão expirada.":res.error;
    $('estqErr').classList.remove('hidden');
  } else {
    row.dataset.orig = novaQtd;
    window._estqProds[i].quantidade = novaQtd;
    $('estqOk').textContent = `✓ ${prod.nome} atualizado para ${novaQtd}`;
    $('estqOk').classList.remove('hidden');
    setTimeout(()=>$('estqOk').classList.add('hidden'), 3000);
  }

  btn.disabled = false;
  btn.textContent = 'Salvar';
}

async function excluirItem(btn){
  const i = parseInt(btn.dataset.i);
  const prod = window._estqProds[i];
  if(!prod) return;

  if(!confirm(`Excluir "${prod.nome}"?\n\nO produto será removido de todas as lojas e some do PDV no próximo sync. O histórico de vendas é preservado.`)) return;

  btn.disabled = true;
  btn.textContent = '...';
  $('estqErr').classList.add('hidden');
  $('estqOk').classList.add('hidden');

  const res = await rpc('excluir_produto', {
    p_email: creds.email,
    p_password: creds.senha,
    p_product_id: prod.productId
  });

  if(res.error){
    $('estqErr').textContent =
      res.error==='invalid_credentials' ? "Sessão expirada, faça login novamente." :
      res.error==='not_found' ? "Produto não encontrado." : res.error;
    $('estqErr').classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = '🗑';
    return;
  }

  // Remove da lista em memória e re-renderiza
  window._estqProds.splice(i, 1);
  renderEstoque();
  $('estqOk').textContent = `✓ ${prod.nome} excluído`;
  $('estqOk').classList.remove('hidden');
  setTimeout(()=>$('estqOk').classList.add('hidden'), 3000);
}

// ---- Novo produto ----
// Nome da categoria que conta como "produção própria" (define o tipo do produto).
function categoriaEhProducao(nome){ return (nome||'').toLowerCase().includes('produ'); }

function abrirNovoProduto(){
  const cats = window._estqCategorias || [];
  if(!cats.length){
    $('estqErr').textContent = "Selecione uma loja primeiro (as categorias carregam com o estoque).";
    $('estqErr').classList.remove('hidden');
    return;
  }
  $('prodCategoria').innerHTML = cats.map(c=>`<option value="${c.id}" data-nome="${c.nome}">${c.nome}</option>`).join('');
  $('prodNome').value=''; $('prodPrecoVenda').value=''; $('prodPrecoCusto').value=''; $('prodBarras').value='';
  $('prodUnidade').value='UN';
  $('prodErr').classList.add('hidden');
  $('prodModal').classList.remove('hidden');
  $('prodNome').focus();
}
function fecharNovoProduto(){ $('prodModal').classList.add('hidden'); }

// Gera código interno para produto sem código de fábrica (coxinha, salgado, bolo).
// Vem do servidor (EAN-13 prefixo 2, reservado pela GS1 p/ uso interno da loja):
// sequência garante que nunca repete, e o prefixo garante que nunca colide com
// produto de fábrica (789/790).
async function gerarCodigoInterno(){
  const btn = $('prodGerarCodigo');
  const txtAnterior = btn.textContent;
  btn.disabled = true; btn.textContent = '...';
  $('prodErr').classList.add('hidden');

  const res = await rpc('gerar_codigo_interno', { p_email: creds.email, p_password: creds.senha });

  btn.disabled = false; btn.textContent = txtAnterior;

  if(res.error){
    $('prodErr').textContent = res.error==='invalid_credentials'
      ? "Sessão expirada, faça login novamente."
      : "Não foi possível gerar o código agora.";
    $('prodErr').classList.remove('hidden');
    return;
  }
  $('prodBarras').value = res.codigo || '';
}

async function salvarNovoProduto(){
  const nome = $('prodNome').value.trim();
  if(!nome){ $('prodNome').focus(); return; }
  const catOpt = $('prodCategoria').selectedOptions[0];
  const catId = catOpt?.value;
  const catNome = catOpt?.dataset.nome || '';
  const tipo = categoriaEhProducao(catNome) ? 'PRODUCAO' : 'NORMAL';
  const unidade = $('prodUnidade').value;
  const precoVenda = Math.round(parseFloat($('prodPrecoVenda').value||'0')*100);
  const precoCusto = Math.round(parseFloat($('prodPrecoCusto').value||'0')*100);
  const barras = $('prodBarras').value.trim();

  $('prodErr').classList.add('hidden');
  const btn = $('prodSalvar');
  btn.disabled = true; btn.textContent = 'Cadastrando...';

  const res = await rpc('criar_produto', {
    p_email: creds.email, p_password: creds.senha,
    p_nome: nome, p_tipo: tipo, p_unidade: unidade,
    p_preco_venda: precoVenda, p_preco_custo: precoCusto,
    p_categoria_id: catId, p_codigo_barras: barras || null
  });

  btn.disabled = false; btn.textContent = 'Cadastrar produto';

  if(res.error){
    $('prodErr').textContent =
      res.error==='invalid_credentials' ? "Sessão expirada, faça login novamente." :
      res.error==='nome_obrigatorio' ? "Informe o nome do produto." :
      res.error==='categoria_invalida' ? "Categoria inválida." :
      res.error==='barcode_obrigatorio' ? "Informe o código de barras do produto." :
      res.error==='barcode_duplicado' ? "Já existe um produto ATIVO com este código de barras." : res.error;
    $('prodErr').classList.remove('hidden');
    return;
  }

  fecharNovoProduto();
  await carregarEstoque(); // recarrega a lista (produto já aparece na loja atual)
  // Se o código de barras já pertencia a um produto EXCLUÍDO antes, a RPC reativa
  // a linha existente (com os dados novos) em vez de criar uma duplicata.
  $('estqOk').textContent = res.reativado
    ? `✓ "${nome}" já existia (estava excluído) e foi reativado`
    : `✓ "${nome}" cadastrado e disponível em todas as lojas`;
  $('estqOk').classList.remove('hidden');
  setTimeout(()=>$('estqOk').classList.add('hidden'), 4000);
}

// ---- Vendas: helpers ----
function metodoLabel(m){
  return ({PIX:'PIX', DINHEIRO:'Dinheiro', CARTAO_DEBITO:'Cartão Débito', CARTAO_CREDITO:'Cartão Crédito'})[m] || m || '—';
}
function statusClass(s){
  s=(s||'').toUpperCase();
  if(s==='APROVADO') return 'aprovado';
  if(s==='CANCELADO') return 'cancelado';
  return 'pendente';
}
function statusLabel(s){
  s=(s||'').toUpperCase();
  return ({APROVADO:'Aprovado', CANCELADO:'Cancelado', PENDENTE:'Pendente', NEGADO:'Negado'})[s] || s;
}
function fmtHoraData(iso){
  const d=new Date(iso);
  if(isNaN(d)) return iso;
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const dia=new Date(d); dia.setHours(0,0,0,0);
  const hora=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if(dia.getTime()===hoje.getTime()) return hora;
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+hora;
}

// ---- Vendas: seletor de loja ----
function preencherSeletorVendaLojas(){
  const sel=$('vendaLoja');
  const atual=sel.value;
  sel.innerHTML='<option value="">Todas as lojas</option>'+
    lojasList.map(l=>`<option value="${l.storeId}">${l.nome}</option>`).join('');
  if(atual) sel.value=atual;
}

// ---- Vendas: carregar lista ----
async function carregarVendas(){
  const p=calcPeriodo(vendaPeriodo);
  $('vendaErr').classList.add('hidden');
  if(!p){ $('vendaErr').textContent="Selecione as datas De e Até."; $('vendaErr').classList.remove('hidden'); return; }

  $('vendaLista').innerHTML='<span class="spinner"></span><span class="muted">Carregando...</span>';
  $('vendaResumo').innerHTML='';

  const storeId=$('vendaLoja').value||null;
  const data=await rpc('get_vendas_rede',{
    p_email:creds.email, p_password:creds.senha,
    p_from:p.de, p_to:p.ate, p_store_id:storeId, p_payment:'TODOS'
  });

  if(data.error){
    $('vendaLista').innerHTML='';
    $('vendaErr').textContent=data.error==='invalid_credentials'?"Sessão expirada, faça login novamente.":data.error;
    $('vendaErr').classList.remove('hidden');
    return;
  }

  const vendas=data.vendas||[];
  window._vendas=vendas;

  // Resumo: total aprovado + qtd
  const aprovadas=vendas.filter(v=>(v.status||'').toUpperCase()==='APROVADO');
  const totFat=aprovadas.reduce((s,v)=>s+(v.total_centavos||0),0);
  $('vendaResumo').innerHTML=`
    <div><div class="vr-fat">${brl(totFat)}</div><div class="vr-l">Faturamento aprovado</div></div>
    <div style="text-align:right"><div class="vr-fat">${aprovadas.length}</div><div class="vr-l">Vendas</div></div>`;

  if(!vendas.length){
    $('vendaLista').innerHTML='<div class="muted" style="padding:8px 0">Nenhuma venda no período.</div>';
    return;
  }

  const mostrarLoja=!storeId;
  $('vendaLista').innerHTML=vendas.map((v,i)=>`
    <div class="venda-row" onclick="abrirVendaDetalhe('${v.id}')">
      <div>
        <div class="venda-hora">${fmtHoraData(v.data)}<span class="badge-status ${statusClass(v.status)}">${statusLabel(v.status)}</span></div>
        <div class="venda-meta">${metodoLabel(v.metodo)} · ${(+v.itens||0)} item(ns)${mostrarLoja&&v.loja?` · ${v.loja}`:''}</div>
      </div>
      <div style="display:flex;align-items:center">
        <div class="venda-tot">${brl(v.total_centavos)}</div>
        <span class="venda-chevron">›</span>
      </div>
    </div>`).join('');
}

// ---- Vendas: detalhe (modal) ----
async function abrirVendaDetalhe(saleId){
  $('vendaModal').classList.remove('hidden');
  $('vendaModalBody').innerHTML='<span class="spinner"></span><span class="muted">Carregando...</span>';

  const d=await rpc('get_venda_detalhe',{ p_email:creds.email, p_password:creds.senha, p_sale_id:saleId });

  if(d.error){
    $('vendaModalBody').innerHTML=`<div class="err">${d.error==='not_found'?'Venda não encontrada.':d.error==='invalid_credentials'?'Sessão expirada.':d.error}</div>`;
    return;
  }

  const itens=(d.itens||[]).map(it=>`
    <div class="md-item">
      <div>
        <div>${it.nome}</div>
        <div class="qi">${(+it.quantidade||0)} × ${brl(it.preco_unit_centavos)}</div>
      </div>
      <div style="font-weight:600">${brl(it.subtotal_centavos)}</div>
    </div>`).join('');

  const temDesconto=(d.desconto_centavos||0)>0;
  const ehDinheiro=(d.metodo||'')==='DINHEIRO' && d.recebido_centavos!=null;

  $('vendaModalBody').innerHTML=`
    <div class="md-row"><span class="k">Data</span><span>${new Date(d.data).toLocaleString('pt-BR')}</span></div>
    ${d.loja?`<div class="md-row"><span class="k">Loja</span><span>${d.loja}</span></div>`:''}
    <div class="md-row"><span class="k">Pagamento</span><span>${metodoLabel(d.metodo)}</span></div>
    <div class="md-row"><span class="k">Status</span><span><span class="badge-status ${statusClass(d.status)}">${statusLabel(d.status)}</span></span></div>

    <div class="md-sec">Itens</div>
    ${itens||'<div class="muted">Sem itens.</div>'}

    ${temDesconto?`<div class="md-row" style="margin-top:10px"><span class="k">Subtotal</span><span>${brl(d.subtotal_centavos)}</span></div>
    <div class="md-row"><span class="k">Desconto</span><span>− ${brl(d.desconto_centavos)}</span></div>`:''}

    <div class="md-total"><span>Total</span><span class="accent">${brl(d.total_centavos)}</span></div>

    ${ehDinheiro?`<div class="md-row" style="margin-top:8px"><span class="k">Recebido</span><span>${brl(d.recebido_centavos)}</span></div>
    <div class="md-row"><span class="k">Troco</span><span>${brl(d.troco_centavos||0)}</span></div>`:''}
  `;
}
function fecharVendaModal(){ $('vendaModal').classList.add('hidden'); }

// ---- Período: wiring genérico por aba ----
function wirePeriods(periodsId, customId, state, onApply){
  document.querySelectorAll('#'+periodsId+' button').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('#'+periodsId+' button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      const d=b.dataset.d;
      if(d==='custom'){
        $(customId).classList.remove('hidden');
        state.dias='custom';
        return; // espera o usuário clicar Aplicar
      }
      $(customId).classList.add('hidden');
      state.dias=parseInt(d,10);
      onApply();
    };
  });
}

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('on'));
    btn.classList.add('on');
    $('tab-'+btn.dataset.tab).classList.add('on');
    if(btn.dataset.tab==='estoque' && lojasList.length) preencherSeletorLojas();
    if(btn.dataset.tab==='vendas'){
      preencherSeletorVendaLojas();
      carregarVendas();
    }
  };
});

$('vendaModal').onclick = (e)=>{ if(e.target===$('vendaModal')) fecharVendaModal(); };

// ---- Seletor de loja (Estoque) ----
$('estqLoja').onchange = carregarEstoque;

document.querySelectorAll('.estq-filters button').forEach(b=>{

    document.querySelectorAll('.estq-filters button').forEach(x=>x.classList.remove('on'));

if('serviceWorker' in navigator){

}
